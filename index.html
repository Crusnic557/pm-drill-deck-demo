<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PM Drill Deck</title>
<meta name="description" content="Spaced-repetition drill deck for project management study: quizzes, flip cards, judgement calls and a glossary across nine courses. Progress is saved in your browser.">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a planning wall. Sticky header, one centred column (max 760px) of index cards, tab bar pinned to the bottom. */
:root{
  --wall:#EEF1F5; --dot:#D3D9E3; --card:#FFFFFF; --ink:#1B2333; --ink-2:#4E5A70; --ink-3:#717D94;
  --line:#D5DBE5; --line-2:#E7EBF1; --sticky:#FFD84D; --on-sticky:#1B2333; --marker:#2448B8; --marker-soft:#E4EAFB;
  --ok:#1D8A55; --ok-soft:#E1F3E9; --bad:#C2372C; --bad-soft:#FBE6E3; --warn:#9A6210; --warn-soft:#FBF0DC;
  --rule-red:#E58A84; --rule-blue:#C9D8EE; --shadow:0 1px 2px rgba(27,35,51,.06),0 6px 16px rgba(27,35,51,.07);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t-xs:.75rem; --t-s:.875rem; --t-m:1rem; --t-l:1.125rem; --t-xl:1.5rem; --t-2xl:2.1rem;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall:#10141C; --dot:#232B39; --card:#182031; --ink:#E6EAF2; --ink-2:#A8B2C6; --ink-3:#8590A5;
  --line:#2C3648; --line-2:#222B3B; --sticky:#F2CF4A; --on-sticky:#1B2333; --marker:#93B1FF; --marker-soft:#1D2946;
  --ok:#4CC38A; --ok-soft:#11301F; --bad:#FF7D71; --bad-soft:#3A1816; --warn:#E9B353; --warn-soft:#33270F;
  --rule-red:#9C4A46; --rule-blue:#2B4062; --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 20px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --wall:#10141C; --dot:#232B39; --card:#182031; --ink:#E6EAF2; --ink-2:#A8B2C6; --ink-3:#8590A5;
  --line:#2C3648; --line-2:#222B3B; --sticky:#F2CF4A; --on-sticky:#1B2333; --marker:#93B1FF; --marker-soft:#1D2946;
  --ok:#4CC38A; --ok-soft:#11301F; --bad:#FF7D71; --bad-soft:#3A1816; --warn:#E9B353; --warn-soft:#33270F;
  --rule-red:#9C4A46; --rule-blue:#2B4062; --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 20px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background-color:var(--wall);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:var(--t-m);line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wall)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--marker)}
:focus-visible{outline:2px solid var(--marker);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-stretch:78%;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:760px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--wall);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-mark{width:26px;height:26px;background:var(--sticky);border-radius:3px;transform:rotate(-5deg);box-shadow:0 2px 0 rgba(0,0,0,.12);display:grid;place-items:center}
.brand-mark svg{width:16px;height:16px;stroke:var(--on-sticky);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.brand-name{font-family:var(--f-display);font-stretch:72%;font-weight:800;font-size:1.3rem;letter-spacing:.01em}
.sync{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:var(--t-xs);color:var(--ink-2);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync[data-mode="synced"]::before{background:var(--ok)}
.sync[data-mode="syncing"]::before{background:var(--marker)}
.sync[data-mode="offline"]::before{background:var(--warn)}

.main{padding-block:20px 128px;display:flex;flex-direction:column;gap:22px;min-height:60vh}
.main:focus{outline:none}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:8px 9px;text-decoration:none;color:var(--ink-3);font-size:var(--t-xs);font-family:var(--f-mono);letter-spacing:.03em}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke:var(--marker)}

/* surfaces */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-head h2{font-size:var(--t-xl);font-weight:750}

/* home */
.hello h1{font-size:var(--t-2xl);font-weight:800}
.hello p{color:var(--ink-2);margin-top:6px;max-width:60ch}
.today{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.stat b{display:block;font-family:var(--f-mono);font-size:1.5rem;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:var(--t-xs);color:var(--ink-2)}
.stat.due b{color:var(--marker)}
.cta{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;background:var(--sticky);color:var(--on-sticky);padding:18px 18px 16px;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 18px -10px rgba(0,0,0,.35);transform:rotate(-.4deg);transition:transform .15s ease}
.cta:hover{transform:rotate(0) translateY(-1px)}
.cta strong{font-family:var(--f-display);font-stretch:75%;font-size:1.6rem;font-weight:800;line-height:1.1}
.cta span{font-size:var(--t-s)}
.setrow{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);width:max-content;max-width:100%}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:var(--t-s);color:var(--ink-2);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card);font-weight:700}
.weak{display:flex;flex-direction:column}
.weak-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line-2)}
.weak-row:first-child{border-top:0}
.weak-row .grow{flex:1;min-width:0}
.weak-row .t{font-weight:700}
.weak-row .s{font-size:var(--t-s);color:var(--ink-2)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;font-size:var(--t-s);font-weight:700;color:var(--ink)}
.btn:hover{border-color:var(--marker)}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.big{padding:12px 16px;font-size:var(--t-m)}
.btn.ghost{background:transparent}
.soon{border:1.5px dashed var(--line);border-radius:var(--r);padding:14px 16px;color:var(--ink-2)}
.soon b{color:var(--ink);font-family:var(--f-display);font-stretch:80%;font-size:1.05rem}

/* bars */
.bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--marker);border-radius:inherit}
.pct{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--ink-2);min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}

/* courses */
.course{overflow:hidden}
.course-head{padding:16px 16px 12px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line-2)}
.course-head h2{font-size:1.45rem;font-weight:780}
.course-head .src{font-size:var(--t-s);color:var(--ink-2)}
.topic-row{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line-2);padding:12px 16px}
.topic-row:first-of-type{border-top:0}
.topic-row:hover{background:var(--marker-soft)}
.topic-row .t{font-weight:700;display:block}
.topic-row .s{font-size:var(--t-xs);color:var(--ink-3);font-family:var(--f-mono)}
.course-foot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line-2)}

/* topic */
.crumb{border:0;background:transparent;padding:0;color:var(--marker);font-size:var(--t-s);font-weight:700;align-self:flex-start}
.topic-hero h1{font-size:var(--t-2xl);font-weight:800}
.topic-hero p{margin-top:8px;color:var(--ink-2);max-width:65ch}
.terms{display:flex;flex-direction:column}
.term{padding:14px 16px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px}
.term:first-child{border-top:0}
.term h3{font-family:var(--f-body);font-stretch:100%;font-size:var(--t-m);font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.term .def{max-width:68ch}
.term .ex{font-size:var(--t-s);color:var(--ink-2);max-width:68ch}
.term .ex::before{content:"Example  ";font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.term .where{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--ink-3)}
mark{background:var(--sticky);color:var(--on-sticky);border-radius:2px;padding:0 1px}
.tag-x{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;border:1px dashed var(--ink-3);color:var(--ink-2);border-radius:4px;padding:1px 6px;white-space:nowrap}

/* glossary */
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px}
.search svg{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none;font-size:var(--t-m)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:var(--t-s);color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:700}
.gl-course{font-family:var(--f-display);font-stretch:78%;font-weight:780;font-size:1.2rem;padding:14px 16px 6px}

/* figures */
/* Wide diagrams scroll sideways on phones; soft edge shadows show there's more to see. */
.fig{overflow-x:auto;padding:10px 0;min-width:0;max-width:100%;-webkit-overflow-scrolling:touch;--fig-shade:color-mix(in srgb,var(--ink) 24%,transparent);
  background:linear-gradient(to right,var(--card) 35%,transparent) left/28px 100% no-repeat local,linear-gradient(to left,var(--card) 35%,transparent) right/28px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%,var(--fig-shade),transparent) left/12px 100% no-repeat scroll,radial-gradient(farthest-side at 100% 50%,var(--fig-shade),transparent) right/12px 100% no-repeat scroll,var(--card)}
.fig svg{display:block;width:100%;min-width:480px;max-width:620px;height:auto;margin-inline:auto;font-family:var(--f-mono)}
.fig .bx{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.fig .bx2{fill:var(--line-2);stroke:none}
.fig .soft{fill:var(--marker-soft);stroke:none}
.fig .s{stroke:var(--ink-2);fill:none;stroke-width:1.4}
.fig .s2{stroke:var(--line);fill:none;stroke-width:1}
.fig .dash{stroke:var(--ink-3);fill:none;stroke-width:1.4;stroke-dasharray:5 4}
.fig .acc{fill:var(--marker);stroke:none}
.fig .acc-s{stroke:var(--marker);fill:none;stroke-width:2.2}
.fig .ok{fill:var(--ok);stroke:none}
.fig .ok-s{stroke:var(--ok);fill:none;stroke-width:2.2}
.fig .bad{fill:var(--bad);stroke:none}
.fig .bad-s{stroke:var(--bad);fill:none;stroke-width:2}
.fig .note{fill:var(--sticky);stroke:none}
.fig .tn{fill:var(--on-sticky);font-size:11px}
.fig .t{fill:var(--ink);font-size:12px}
.fig .tb{fill:var(--ink);font-size:12.5px;font-weight:600}
.fig .t2{fill:var(--ink-2);font-size:10.5px}
.fig .tw{fill:var(--card);font-size:11px;font-weight:600}
.fig .ta{fill:var(--marker);font-size:11px;font-weight:600}
.fig .tbad{fill:var(--bad);font-size:11px;font-weight:600}
.fig .tok{fill:var(--ok);font-size:11px;font-weight:600}
.fig .tc{fill:var(--ink);font-size:11px}
.fig .rule{stroke:var(--rule-red);stroke-width:2;fill:none}
.fig .ah{fill:var(--ink-2);stroke:none}
.fig .ah-acc{fill:var(--marker);stroke:none}
.fig .tL{fill:var(--card);font-size:22px;font-weight:700}
.fig tspan.tok,.fig tspan.tbad,.fig tspan.ta{font-size:inherit}

/* session */
.sess-top{display:flex;align-items:center;gap:12px}
.sess-top .grow{flex:1;min-width:0}
.sess-title{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-bar{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:6px}
.sess-bar i{display:block;height:100%;background:var(--ink);transition:width .25s ease}
.sess-count{font-family:var(--f-mono);font-size:var(--t-s);color:var(--ink-2);font-variant-numeric:tabular-nums}
.icard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.icard-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:12px 16px 10px;border-bottom:2px solid var(--rule-red);font-family:var(--f-mono);font-size:var(--t-xs);color:var(--ink-2)}
.icard-meta .grow{flex:1}
.pips{letter-spacing:1px;color:var(--ink)}
.pill{border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.pill.rev{border-color:var(--marker);color:var(--marker)}
.icard-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:14px}
.q{font-size:var(--t-l);line-height:1.5;font-weight:700;max-width:65ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px}
.opt:hover:not([disabled]){border-color:var(--marker)}
.opt[disabled]{cursor:default}
.opt .k{font-family:var(--f-mono);font-size:var(--t-s);font-weight:600;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.opt .txt{font-size:var(--t-m)}
.opt .why{display:block;margin-top:6px;font-size:var(--t-s);color:var(--ink-2)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt.dim{opacity:.92}
.opt.picked{border-color:var(--marker);background:var(--marker-soft)}
.opt.picked .k{background:var(--marker);border-color:var(--marker);color:var(--card)}
.opt .why b{font-weight:700;color:var(--ink)}
.ctx{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--ink-2);margin-top:-8px}
.happened{border-left:3px solid var(--marker);background:var(--marker-soft);padding:12px 14px;border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:6px}
.happened .label{color:var(--marker)}
.happened .src{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--ink-2)}
.happened .src a{color:inherit}
.verdict{display:flex;align-items:center;gap:10px;font-weight:700;padding:10px 12px;border-radius:8px}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.miss{background:var(--bad-soft);color:var(--bad)}
.verdict small{display:block;font-weight:400;color:var(--ink-2);font-size:var(--t-s)}
.takeaway{background:var(--sticky);color:var(--on-sticky);padding:12px 14px 13px;border-radius:3px;box-shadow:0 8px 14px -10px rgba(0,0,0,.4);transform:rotate(-.3deg)}
.takeaway .label{color:var(--on-sticky);opacity:.75}
.takeaway p{margin-top:2px;font-weight:700}
.tchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tchip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:var(--t-xs);color:var(--ink-2)}
.tchip[aria-expanded="true"]{border-color:var(--marker);color:var(--marker)}
.tdef{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:var(--t-s);display:flex;flex-direction:column;gap:4px}
.tdef b{font-size:var(--t-m)}

/* flip card */
.flip{perspective:1400px}
.flip-in{position:relative;display:grid;grid-template-columns:minmax(0,1fr);transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;min-width:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:260px}
.face.back{transform:rotateY(180deg)}
.face .icard-body{min-height:200px;justify-content:center}
.face.back .fig{border-radius:4px;padding:8px 4px}
.front-term{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:2rem;line-height:1.1;text-wrap:balance}
.front-q{font-size:var(--t-l);font-weight:700;line-height:1.5}
.hint{font-size:var(--t-s);color:var(--ink-3)}
.back-a{font-size:var(--t-l);line-height:1.55;max-width:62ch}
.back-ex{font-size:var(--t-m);color:var(--ink-2);max-width:62ch}
.back-ex b{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-right:6px}

/* action bar */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.actionbar-in{display:flex;gap:8px;padding-block:10px;justify-content:flex-end;flex-wrap:wrap}
.actionbar .btn{flex:1;max-width:260px}
.actionbar .rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.actionbar .rate .btn{max-width:none}
.btn.r0{border-color:var(--bad);color:var(--bad)}
.btn.r1{border-color:var(--warn);color:var(--warn)}
.btn.r2{border-color:var(--ok);color:var(--ok)}
.keys{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--ink-3);align-self:center;margin-right:auto}
.btn kbd{font-family:var(--f-mono);font-size:.68rem;font-weight:500;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:8px;opacity:.65;vertical-align:1px}
.verdict .guess{margin-left:auto;flex:none;background:transparent;border:1px solid currentColor;border-radius:6px;padding:5px 9px;font-size:var(--t-xs);font-weight:700;color:inherit}

/* summary */
.sum-head h1{font-size:var(--t-2xl);font-weight:800}
.sum-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.miss-list{display:flex;flex-direction:column}
.miss-list li{list-style:none;padding:10px 14px;border-top:1px solid var(--line-2);font-size:var(--t-s)}
.miss-list li:first-child{border-top:0}
.miss-list ul{margin:0;padding:0}

/* progress */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.col{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.col .label{font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col b{font-family:var(--f-mono);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.col .bar{min-width:0;height:5px}
.chart{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.chart-y{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--f-mono);font-size:.68rem;color:var(--ink-3);text-align:right;height:120px}
.chart-bars{height:120px;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;border-bottom:1px solid var(--line);background-image:linear-gradient(var(--line-2) 1px,transparent 1px);background-size:100% 50%}
.cbar{position:relative;background:var(--line);border-radius:3px 3px 0 0;min-height:0}
.cbar i{position:absolute;left:0;right:0;bottom:0;background:var(--marker);border-radius:inherit}
.chart-x{grid-column:2;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;font-family:var(--f-mono);font-size:.62rem;color:var(--ink-3);text-align:center}
.legend{display:flex;gap:14px;font-size:var(--t-xs);color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.prog-topic{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,140px) auto;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line-2);font-size:var(--t-s)}
.prog-topic:first-of-type{border-top:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 14px;border-radius:8px;font-size:var(--t-s);z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

@media (max-width:520px){
  .today{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topic-row{grid-template-columns:minmax(0,1fr) 64px auto}
  .front-term{font-size:1.7rem}
  .setrow{grid-template-columns:1fr}
  .keys,.btn kbd{display:none}
  .board{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  .flip-in,.cta,.sess-bar i{transition:none}
}

<script>
(function () {
  "use strict";
  var COURSES = window.PMQ.courses, FIGS = window.PMQ.figs;
  // Courses still to come. Each one disappears from this list once its data file is added.
  var ROADMAP = [
    { id: "supply", title: "Supply Chain Project Management", sub: "DIRECT framework, SIPOC, flowcharts, systems thinking, value stream mapping, Lean Six Sigma" },
    { id: "procurement", title: "Procurement Management", sub: "Contract types, planning, conducting and controlling procurements, agile procurement" },
    { id: "thinking", title: "Critical Thinking & Decisions with GenAI", sub: "PIQPACC, DREAMS, AI and human biases, premortems, futurecasting" },
    { id: "pmp", title: "PMP-style scenarios", sub: "Best-next-move situations for exam concepts the courses don't cover: people, process, business environment" },
    { id: "grey", title: "Grey areas: real management calls", sub: "Real cases where management decisions went badly wrong, with no clean answer, and what actually happened" }
  ];

  /* ---------- helpers ---------- */
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var escRx = function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); };
  function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  function dayNum(t) { t = t || Date.now(); return Math.floor((t - new Date(t).getTimezoneOffset() * 60000) / 86400000); }
  function dayKey(n) { return new Date(n * 86400000).toISOString().slice(0, 10); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var INTERVALS = [0, 1, 3, 7, 14, 30];          // days until next review, by box
  var DIFF = { 1: "Easy", 2: "Medium", 3: "Hard" };
  var PIPS = { 1: "●○○", 2: "●●○", 3: "●●●" };
  var TYPE_ORDER = { term: 0, mcq: 1, call: 1, flip: 2 };
  var plural = function (n, w) { return n + " " + w + (n === 1 ? "" : "s"); };
  var pct = function (x) { return Math.round(x * 100) + "%"; };

  /* ---------- content model ---------- */
  var ITEMS = [], BY_ID = {}, TOPICS = [], TOPIC_BY_KEY = {};
  COURSES.forEach(function (c, ci) {
    c.topics.forEach(function (t, ti) {
      var T = { key: c.id + "." + t.id, c: c, t: t, ci: ci, ti: ti, items: [] };
      TOPICS.push(T); TOPIC_BY_KEY[T.key] = T;
      (t.terms || []).forEach(function (g) { add(T, { type: "term", d: 1, front: g[0], back: g[1], ex: g[2], x: !!g[3], fig: g[4], seed: "g|" + g[0] }); });
      (t.cards || []).forEach(function (q) { add(T, { type: "mcq", d: q.d || 2, q: q.q, opts: q.o, k: q.k, fig: q.fig, af: q.af, x: !!q.x, seed: "q|" + q.q }); });
      (t.flips || []).forEach(function (f) { add(T, { type: "flip", d: f.d || 2, front: f.f, back: f.b, fig: f.fig, bf: f.bf, x: !!f.x, seed: "f|" + f.f }); });
      // judgement calls: no right answer; every option shows its risks, then what actually happened
      (t.calls || []).forEach(function (c) { add(T, { type: "call", d: c.d || 2, q: c.q, ctx: c.ctx, opts: c.o, h: c.h, k: c.k, src: c.src || [], fig: c.fig, af: c.af, x: !!c.x, seed: "c|" + c.q }); });
    });
  });
  function add(T, it) {
    it.id = hash(T.key + "|" + it.seed); it.T = T;
    if (BY_ID[it.id]) console.warn("Duplicate card skipped:", it.seed);
    else { BY_ID[it.id] = it; T.items.push(it); ITEMS.push(it); }
  }
  var GLOSS = ITEMS.filter(function (it) { return it.type === "term"; }).sort(function (a, b) { return a.front.localeCompare(b.front); });
  var baseName = function (s) { return s.replace(/\s*\([^)]*\)\s*/g, " ").trim(); };
  var TERM_INDEX = GLOSS.map(function (g) { return { g: g, rx: new RegExp("(^|[^A-Za-z])" + escRx(baseName(g.front)) + "(s|es)?([^A-Za-z]|$)", "i") }; })
    .sort(function (a, b) { return baseName(b.g.front).length - baseName(a.g.front).length; });
  function termsFor(it) {
    if (it._terms) return it._terms;
    var text = [it.q, it.k, it.front, it.back].concat((it.opts || []).map(function (o) { return o[0]; })).filter(Boolean).join(" ");
    var found = [];
    for (var i = 0; i < TERM_INDEX.length && found.length < 4; i++) {
      var g = TERM_INDEX[i].g;
      if (g.id === it.id) continue;
      var name = baseName(g.front).toLowerCase();
      if (found.some(function (f) { return baseName(f.front).toLowerCase().indexOf(name) >= 0; })) continue;
      if (TERM_INDEX[i].rx.test(text)) found.push(g);
    }
    found.sort(function (a, b) { return (a.T.c === it.T.c ? 0 : 1) - (b.T.c === it.T.c ? 0 : 1); });
    it._terms = found; return found;
  }

  /* ---------- progress state ---------- */
  var LS_KEY = "pm-drill-deck:v1";
  function blank() { return { v: 1, cards: {}, days: {}, settings: { len: 15, style: "mixed", diff: "prog", at: 0 }, at: 0 }; }
  function normalize(o) {
    var b = blank(); if (!o || typeof o !== "object") return b;
    b.cards = o.cards && typeof o.cards === "object" ? o.cards : {};
    b.days = o.days && typeof o.days === "object" ? o.days : {};
    if (o.settings && typeof o.settings === "object") Object.keys(b.settings).forEach(function (k) { if (o.settings[k] != null) b.settings[k] = o.settings[k]; });
    b.at = o.at || 0; return b;
  }
  function loadLocal() { try { var raw = localStorage.getItem(LS_KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {} return blank(); }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
  var S = loadLocal();
  function touch() { S.at = Date.now(); saveLocal(); queueRemote(1500); }

  function merge(a, b) {
    var out = blank();
    Object.keys(a.cards).concat(Object.keys(b.cards)).forEach(function (id) {
      var x = a.cards[id], y = b.cards[id];
      out.cards[id] = !x ? y : !y ? x : ((y.l || 0) > (x.l || 0) ? y : x);
    });
    Object.keys(a.days).concat(Object.keys(b.days)).forEach(function (k) {
      var x = a.days[k] || { n: 0, c: 0 }, y = b.days[k] || { n: 0, c: 0 };
      out.days[k] = (y.n || 0) > (x.n || 0) ? y : x;
    });
    out.settings = (b.settings.at || 0) > (a.settings.at || 0) ? b.settings : a.settings;
    out.at = Math.max(a.at || 0, b.at || 0);
    return out;
  }

  /* ---------- account sync (db capability, with this device as fallback) ---------- */
  var sync = { ref: null, writing: false, dirty: false, timer: 0, retried: false };
  function setSync(mode, text) { var el = $("#sync"); if (el) { el.dataset.mode = mode; el.textContent = text; } }
  function withTimeout(p, ms) {
    return new Promise(function (res, rej) {
      var t = setTimeout(function () { rej({ code: "timeout" }); }, ms);
      p.then(function (v) { clearTimeout(t); res(v); }, function (e) { clearTimeout(t); rej(e); });
    });
  }
  function initRemote() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (id) {
        if (!id) return;
        sync.ref = db.doc("data/users/" + id + "/progress");
        setSync("syncing", "Syncing…");
        return pull();
      });
    }).catch(function () { setSync("local", "Saved on this device"); });
  }
  function pull() {
    if (!sync.ref) return Promise.resolve();
    return withTimeout(sync.ref.get(), 10000).then(function (snap) {
      var before = JSON.stringify(S);
      if (snap && snap.exists) {
        var remote = normalize(JSON.parse(JSON.stringify(snap.data())));
        S = merge(S, remote); saveLocal();
        if (JSON.stringify(S) !== JSON.stringify(remote)) queueRemote(300);
      } else if (Object.keys(S.cards).length) queueRemote(300);
      setSync("synced", "Synced to your account");
      if (JSON.stringify(S) !== before && view !== "session") render();
    }).catch(function (e) {
      setSync("offline", e && e.code === "timeout" ? "Can't reach sync yet" : "Saved on this device");
    });
  }
  function queueRemote(delay) { if (!sync.ref) return; clearTimeout(sync.timer); sync.timer = setTimeout(pushRemote, delay); }
  function pushRemote() {
    if (!sync.ref) return;
    if (sync.writing) { sync.dirty = true; return; }
    sync.writing = true; sync.dirty = false;
    setSync("syncing", "Saving…");
    sync.ref.set(JSON.parse(JSON.stringify(S))).then(function () {
      sync.retried = false; setSync("synced", "Synced to your account");
    }, function (e) {
      var code = e && e.code;
      if (code === "unavailable" && !sync.retried) { sync.retried = true; setTimeout(function () { queueRemote(0); }, 1200 + Math.random() * 1500); }
      if (code === "invalid_argument" || code === "revoked" || code === "not_granted" || code === "capability_disabled") sync.ref = null;
      setSync("offline", "Saved on this device");
    }).then(function () { sync.writing = false; if (sync.dirty) queueRemote(600); });
  }
  document.addEventListener("visibilitychange", function () {
    if (!sync.ref) return;
    if (document.visibilityState === "hidden") { clearTimeout(sync.timer); pushRemote(); }
    else pull();
  });

  /* ---------- stats ---------- */
  var st = function (it) { return S.cards[it.id]; };
  function counts(items) {
    var t = dayNum(), r = { due: 0, fresh: 0, mastered: 0, seen: 0, total: items.length };
    items.forEach(function (it) { var s = st(it); if (!s) r.fresh++; else { r.seen++; if (s.d <= t) r.due++; if (s.b >= 5) r.mastered++; } });
    return r;
  }
  function mastery(items) { if (!items.length) return 0; var sum = 0; items.forEach(function (it) { var s = st(it); sum += s ? Math.min(5, s.b || 0) : 0; }); return sum / (items.length * 5); }
  function accuracy(items) { var c = 0, w = 0; items.forEach(function (it) { var s = st(it); if (s) { c += s.c || 0; w += s.w || 0; } }); return { n: c + w, acc: c + w ? c / (c + w) : null }; }
  function streak() {
    var t = dayNum(), d = (S.days[dayKey(t)] && S.days[dayKey(t)].n) ? t : t - 1, n = 0;
    while (S.days[dayKey(d)] && S.days[dayKey(d)].n > 0) { n++; d--; }
    return n;
  }
  function scopeItems(scope) {
    if (scope === "all") return ITEMS;
    if (scope.indexOf("m:") === 0) return scope.slice(2).split(",").map(function (id) { return BY_ID[id]; }).filter(Boolean);   // cards missed in the last session
    if (scope.indexOf("c:") === 0) return ITEMS.filter(function (it) { return it.T.c.id === scope.slice(2); });
    return ITEMS.filter(function (it) { return it.T.key === scope.slice(2); });
  }
  function scopeTitle(scope) {
    if (scope === "all") return "Mixed practice · all courses";
    if (scope.indexOf("m:") === 0) return "Cards you just missed";
    if (scope.indexOf("c:") === 0) { var c = COURSES.find(function (x) { return x.id === scope.slice(2); }); return c ? c.short || c.title : "Course"; }
    var T = TOPIC_BY_KEY[scope.slice(2)]; return T ? T.t.title : "Topic";
  }

  /* ---------- building a session ---------- */
  function rank(it) { return st(it) ? 0 : it.d * 10 + TYPE_ORDER[it.type]; }
  function buildSession(scope, o) {
    var len = o.len || S.settings.len, style = o.style || S.settings.style, diff = o.diff || S.settings.diff, t = dayNum();
    var pool = scopeItems(scope);
    if (style === "quiz") pool = pool.filter(function (it) { return it.type === "mcq" || it.type === "call"; });
    else if (style === "flip") pool = pool.filter(function (it) { return it.type === "term" || it.type === "flip"; });
    if (diff === "1" || diff === "2" || diff === "3") pool = pool.filter(function (it) { return it.d === +diff; });
    var due = pool.filter(function (it) { return st(it) && st(it).d <= t; })
      .sort(function (a, b) { return (st(a).d - st(b).d) || (st(a).b - st(b).b); });
    var groups = {};
    pool.filter(function (it) { return !st(it); }).forEach(function (it) { (groups[it.T.key] = groups[it.T.key] || []).push(it); });
    var queues = Object.keys(groups).map(function (k) {
      var arr = shuffle(groups[k]), out = [];
      // questions (with explanations) come up about twice as often as glossary terms; flip cards fill in
      var order = Math.random() < 0.65 ? ["mcq", "call", "term", "mcq", "flip"] : ["term", "mcq", "call", "mcq", "flip"];
      [1, 2, 3].forEach(function (d) {      // easy before medium before hard
        var lists = { term: [], mcq: [], call: [], flip: [] };
        arr.forEach(function (it) { if (it.d === d) lists[it.type].push(it); });
        while (lists.term.length || lists.mcq.length || lists.call.length || lists.flip.length) order.forEach(function (ty) { if (lists[ty].length) out.push(lists[ty].shift()); });
      });
      return out;
    });
    if (scope === "all") shuffle(queues);
    var fresh = [];
    while (queues.some(function (q) { return q.length; })) queues.forEach(function (q) { if (q.length) fresh.push(q.shift()); });
    var nNew = Math.min(fresh.length, Math.max(len - due.length, Math.round(len * 0.3)));
    var nDue = Math.min(due.length, len - nNew);
    if (nDue + nNew < len) nNew = Math.min(fresh.length, len - nDue);
    var picked = due.slice(0, nDue).concat(fresh.slice(0, nNew)), extra = false;
    if (picked.length < len) {
      var rest = pool.filter(function (it) { return st(it) && picked.indexOf(it) < 0; })
        .sort(function (a, b) { return (st(a).b - st(b).b) || ((st(a).l || 0) - (st(b).l || 0)); })
        .slice(0, len - picked.length);
      if (rest.length) extra = true;
      picked = picked.concat(rest);
    }
    return { items: interleave(picked), extra: extra };
  }
  function interleave(items) {
    var pool = shuffle(items.slice()), out = [];
    while (pool.length) {
      var last = out[out.length - 1], idx = 0;
      if (last) { idx = pool.findIndex(function (it) { return it.T.key !== last.T.key; }); if (idx < 0) idx = 0; }
      out.push(pool.splice(idx, 1)[0]);
    }
    var pos = {};
    out.forEach(function (it, i) { (pos[it.T.key] = pos[it.T.key] || []).push(i); });
    Object.keys(pos).forEach(function (k) {
      var ps = pos[k], its = ps.map(function (i) { return out[i]; }).sort(function (a, b) { return rank(a) - rank(b); });
      ps.forEach(function (p, n) { out[p] = its[n]; });
    });
    return out;
  }

  /* ---------- grading (Leitner boxes 1–5) ---------- */
  var R = null;
  function grade(it, q) {        // q: 0 = missed, 1 = partly, 2 = knew it
    var t = dayNum(), prev = S.cards[it.id], s = prev ? Object.assign({}, prev) : { b: 0, c: 0, w: 0 }, before = s.b || 0;
    if (q === 0) { s.b = 1; s.d = t; s.w = (s.w || 0) + 1; }
    else if (q === 1) { s.b = Math.max(1, before); s.d = t + 1; s.c = (s.c || 0) + 1; }
    else {
      if (R && R.missed[it.id]) { s.b = Math.max(1, before); s.d = t + 1; }
      else { s.b = Math.min(5, before + 1); s.d = t + INTERVALS[s.b]; }
      s.c = (s.c || 0) + 1;
    }
    s.l = Date.now(); S.cards[it.id] = s;
    var k = dayKey(t), day = S.days[k] || (S.days[k] = { n: 0, c: 0 });
    day.n++; if (q === 2) day.c++;
    if (R) {
      if (!(it.id in R.first)) { R.first[it.id] = q; R.answered++; if (q === 2) R.correct++; }
      if (q === 0) R.missed[it.id] = true;
      if (q === 2 && s.b > before) R.up++;      // only real promotions count as "moved up"
    }
    touch();
    return s;
  }
  function requeue(it) {
    var n = R.requeues[it.id] || 0;
    if (n >= 2) return false;
    R.requeues[it.id] = n + 1;
    var pos = Math.min(R.items.length, R.i + 3 + Math.floor(Math.random() * 3));
    R.items.splice(pos, 0, it);
    return true;
  }

  function callHtml(it) {

      var o = it.opts[oi], mine = done && pos === R.pick;
      h += '<button type="button" class="opt' + (mine ? " picked" : done ? " dim" : "") + '" data-act="choose" data-pos="' + pos + '"' + (done ? " disabled" : "") + '><span class="k">' + "ABCD"[pos] + '</span><span class="txt">' + esc(o[0]) +
        (done ? '<span class="why"><b>' + (mine ? "Your call. " : "") + "Risks: </b>" + esc(o[1]) + "</span>" : "") + "</span></button>";
    });
    h += "</div>";
    if (done) {
      h += '<div class="happened" role="status"><span class="label">What actually happened</span><p>' + esc(it.h) + "</p>" +
        (it.src && it.src.length ? '<p class="src">Sources: ' + it.src.map(function (s) { return '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener noreferrer">' + esc(s[0]) + "</a>"; }).join(" · ") + "</p>" : "") + "</div>";
      if (it.k) h += '<div class="takeaway"><span class="label">Lesson</span><p>' + esc(it.k) + "</p></div>";
      if (it.af && FIGS[it.af]) h += '<div class="fig">' + FIGS[it.af] + "</div>";
      h += termChips(it);
    }
    return h + "</div></article>";
  }
  function termChips(it) {
    var ts = termsFor(it); if (!ts.length) return "";
    var open = R.open ? BY_ID[R.open] : null;
    return '<div class="tchips"><span class="label">terms</span>' + ts.map(function (g) { return '<button type="button" class="tchip" data-act="term" data-id="' + g.id + '" aria-expanded="' + (R.open === g.id) + '">' + esc(g.front) + "</button>"; }).join("") + "</div>" +
      (open ? '<div class="tdef"><b>' + esc(open.front) + "</b><span>" + esc(open.back) + "</span>" + (open.ex ? '<span class="muted">Example: ' + esc(open.ex) + "</span>" : "") + "</div>" : "");
  }
  function flipHtml(it) {
    var isTerm = it.type === "term", on = R.phase !== "ask";
    var front = isTerm
      ? '<span class="label">glossary term · what does it mean?</span><p class="front-term">' + esc(it.front) + '</p><p class="hint">Say the meaning out loud and think of an example, then flip.</p>'
      : '<span class="label">think it through, then flip</span><p class="front-q">' + esc(it.front) + '</p>' + (it.fig && FIGS[it.fig] ? '<div class="fig">' + FIGS[it.fig] + "</div>" : "") + '<p class="hint">Answer in your head first. Be honest when you rate yourself.</p>';
    var back = isTerm
      ? '<span class="label">' + esc(it.front) + '</span><p class="back-a">' + esc(it.back) + "</p>" + (it.ex ? '<p class="back-ex"><b>Example</b>' + esc(it.ex) + "</p>" : "")
      : '<span class="label">model answer</span><p class="back-a">' + esc(it.back) + "</p>" + (it.bf && FIGS[it.bf] ? '<div class="fig">' + FIGS[it.bf] + "</div>" : "");
    return '<div class="flip' + (on ? " on" : "") + '"><div class="flip-in">' +
      '<article class="icard face front" ' + (on ? 'aria-hidden="true"' : 'data-act="flip" style="cursor:pointer"') + ">" + metaHtml(it) + '<div class="icard-body">' + front + "</div></article>" +
      '<article class="icard face back" ' + (on ? "" : 'aria-hidden="true"') + ">" + metaHtml(it) + '<div class="icard-body">' + back + (on ? termChips(it) : "") + "</div></article>" +
      "</div></div>";
  }
  function renderBar(it) {
    var h = "";
    if (it.type === "call") {
      h = R.phase === "done" ? '<div class="rate"><button type="button" class="btn big r0" data-act="rate" data-q="0">Missed the risks<kbd>1</kbd></button><button type="button" class="btn big r1" data-act="rate" data-q="1">Saw some<kbd>2</kbd></button><button type="button" class="btn big r2" data-act="rate" data-q="2">Saw them<kbd>3</kbd></button></div>'
        : '<span class="keys">Keys 1–4 or A–D to choose</span><button type="button" class="btn big ghost" data-act="skip">Skip for now</button>';
    } else if (it.type === "mcq") {
      h = R.phase === "done" ? '<span class="keys">Enter = next' + (R.order[R.pick] === 0 && !R.guessed ? " · G = I guessed" : "") + '</span><button type="button" class="btn primary big" data-act="next">' + (R.i + 1 >= R.items.length ? "See results" : "Next card") + "</button>"
        : '<span class="keys">Keys 1–4 or A–D to answer</span><button type="button" class="btn big ghost" data-act="skip">Skip for now</button>';
    } else {
      h = R.phase === "ask" ? '<span class="keys">Space = flip</span><button type="button" class="btn primary big" data-act="flip">Flip card</button>'
        : '<div class="rate"><button type="button" class="btn big r0" data-act="rate" data-q="0">Didn\'t know<kbd>1</kbd></button><button type="button" class="btn big r1" data-act="rate" data-q="1">Partly<kbd>2</kbd></button><button type="button" class="btn big r2" data-act="rate" data-q="2">Knew it<kbd>3</kbd></button></div>';
    }
    $("#bar-slot").innerHTML = '<div class="actionbar"><div class="wrap actionbar-in">' + h + "</div></div>";
  }
  function choose(pos) {
    if (R.phase !== "ask") return;
    var it = R.items[R.i]; R.pick = pos; R.phase = "done";
    if (it.type === "call") { renderSession(); return; }      // graded when the learner rates how well they saw the risks
    var ok = R.order[pos] === 0;
    R.before = S.cards[it.id] ? Object.assign({}, S.cards[it.id]) : null; R.upBefore = R.up; R.guessed = false;
    grade(it, ok ? 2 : 0);
    R.requeuedNow = ok ? false : requeue(it);
    renderSession();
  }
  function guessed() {      // a lucky guess shouldn't climb the boxes: treat it like "partly", so it comes back tomorrow
    var it = R && R.items[R.i];
    if (!it || it.type !== "mcq" || R.phase !== "done" || R.guessed || R.order[R.pick] !== 0) return;
    var s = R.before ? Object.assign({}, R.before) : { b: 0, c: 0, w: 0 };
    s.b = Math.max(1, s.b || 0); s.d = dayNum() + 1; s.c = (s.c || 0) + 1; s.l = Date.now();
    S.cards[it.id] = s; R.up = R.upBefore; R.guessed = true; touch(); renderSession();
  }
  function doFlip() {
    if (!R || R.phase !== "ask") return;
    var it = R.items[R.i], f = $(".flip");
    R.phase = "back";
    if (!f) return renderSession();
    f.classList.add("on");
    var front = f.querySelector(".front"), back = f.querySelector(".back");
    front.setAttribute("aria-hidden", "true"); front.removeAttribute("data-act"); front.style.cursor = "";
    back.removeAttribute("aria-hidden");
    back.querySelector(".icard-body").insertAdjacentHTML("beforeend", termChips(it));
    renderBar(it);
  }
  function rate(q) {
    var it = R.items[R.i]; grade(it, q);
    if (q === 0) requeue(it);
    next();
  }
  function next() {
    R.i++; R.phase = "ask"; R.order = null; R.pick = -1; R.open = null; R.requeuedNow = false;
    if (R.i >= R.items.length) { view = "summary"; render(); }
    else renderSession();
    window.scrollTo(0, 0);
  }
  function skip() {
    var it = R.items.splice(R.i, 1)[0];
    R.items.push(it); R.phase = "ask"; R.order = null;
    renderSession();
  }

  function renderSummary() {
    if (!R) return go("practice");
    var acc = R.answered ? R.correct / R.answered : 0, missedIds = Object.keys(R.missed);
    var head = R.answered === 0 ? "Session ended" : acc >= 0.85 ? "Strong session" : acc >= 0.6 ? "Good work" : "Plenty to come back to";
    main.innerHTML = '<section class="sum-head stack" style="gap:6px"><span class="label">' + esc(R.title) + "</span><h1>" + head + "</h1><p class=\"muted\">" +
      (R.answered ? "First-try score " + R.correct + " of " + R.answered + ". Missed cards are due again " + (missedIds.length ? "today and tomorrow" : "on schedule") + "." : "No cards answered this time.") + "</p></section>" +
      '<section class="sum-grid"><div class="stat"><b>' + (R.answered ? pct(acc) : "–") + '</b><span>first-try correct</span></div><div class="stat"><b>' + R.up + '</b><span>cards moved up</span></div><div class="stat"><b>' + streak() + "</b><span>day streak</span></div></section>" +
      (missedIds.length ? '<section class="stack"><div class="section-head"><h2>Come back to these</h2><span class="label">' + missedIds.length + '</span></div><div class="panel miss-list"><ul>' + missedIds.map(function (id) {
        var it = BY_ID[id]; var label = it.q || it.front;
        return "<li>" + esc(label.length > 120 ? label.slice(0, 117) + "…" : label) + ' <span class="label">· ' + esc(it.T.t.title) + "</span></li>";
      }).join("") + "</ul></div></section>" : "") +
      '<div class="row">' + (missedIds.length ? '<button type="button" class="btn primary big" data-act="drill-missed" data-ids="' + missedIds.join(",") + '">Drill the ' + plural(missedIds.length, "card") + " you missed</button>" : "") +
      '<button type="button" class="btn big' + (missedIds.length ? "" : " primary") + '" data-act="again">Another ' + (R.scope === "all" ? "mixed session" : "round") + '</button><button type="button" class="btn big" data-act="home">Back to practice</button></div>';
  }

  /* ---------- events ---------- */
  var toastTimer = 0;
  function toast(msg) { var el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 3800); }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var a = b.dataset.act;
    if (a === "start") startSession(b.dataset.scope, b.dataset.style ? { style: b.dataset.style, diff: "prog" } : {});
    else if (a === "set") { var k = b.dataset.k, v = b.dataset.v; S.settings[k] = k === "len" ? +v : v; S.settings.at = Date.now(); touch(); render(); }
    else if (a === "topic") { topicKey = b.dataset.key; go("topic"); }
    else if (a === "back") go("courses");
    else if (a === "choose") choose(+b.dataset.pos);
    else if (a === "next") next();
    else if (a === "skip") skip();
    else if (a === "flip") doFlip();
    else if (a === "rate") rate(+b.dataset.q);
    else if (a === "term") { R.open = R.open === b.dataset.id ? null : b.dataset.id; renderSession(); }
    else if (a === "end") { view = "summary"; render(); window.scrollTo(0, 0); }
    else if (a === "again") startSession(R.scope, R.o);
    else if (a === "guessed") guessed();
    else if (a === "drill-missed") { var ids = b.dataset.ids.split(","); startSession("m:" + ids.join(","), { len: ids.length, style: "mixed", diff: "prog" }); }
    else if (a === "home") { R = null; if (location.hash !== "#practice") location.hash = "#practice"; else go("practice"); }
    else if (a === "gchip") { glossFilter = b.dataset.c; renderGlossary(); }
    else if (a === "reset") { resetArmed = true; render(); }
    else if (a === "reset-no") { resetArmed = false; render(); }
    else if (a === "reset-yes") { var keep = S.settings; S = blank(); S.settings = keep; resetArmed = false; touch(); render(); toast("Progress erased."); }
  });
  document.addEventListener("keydown", function (e) {
    if (view !== "session" || !R || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    var it = R.items[R.i]; if (!it) return;
    var key = e.key.toLowerCase();
    if (it.type === "call") {
      if (R.phase === "ask") { var c = "1234".indexOf(key); if (c < 0) c = "abcd".indexOf(key); if (c >= 0 && c < R.order.length) { e.preventDefault(); choose(c); } }
      else { var cq = "123".indexOf(key); if (cq >= 0) { e.preventDefault(); rate(cq); } }
    } else if (it.type === "mcq") {
      if (R.phase === "ask") { var n = "1234".indexOf(key); if (n < 0) n = "abcd".indexOf(key); if (n >= 0 && n < R.order.length) { e.preventDefault(); choose(n); } }
      else if (key === "enter" || key === "arrowright" || key === " ") { e.preventDefault(); next(); }
      else if (key === "g") { e.preventDefault(); guessed(); }
    } else if (R.phase === "ask") { if (key === " " || key === "enter" || key === "f") { e.preventDefault(); doFlip(); } }
    else { var q = "123".indexOf(key); if (q >= 0) { e.preventDefault(); rate(q); } }
  });

  /* ---------- boot ---------- */
  route();
  initRemote();
})();
</script>

</body>
</html>
